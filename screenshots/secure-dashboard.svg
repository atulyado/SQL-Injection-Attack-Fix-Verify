<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Secure dashboard example</title>
  <desc id="desc">Illustrative screenshot of the secure message board showing encoded XSS text.</desc>
  <rect width="1280" height="760" fill="#f7f9fc"/>
  <rect width="1280" height="74" fill="#1f2937"/>
  <text x="70" y="47" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Vulnerable Web Application Lab</text>
  <rect x="80" y="110" width="1120" height="120" rx="8" fill="#e8f7f4" stroke="#a8dad4"/>
  <text x="112" y="160" fill="#607084" font-family="Arial, sans-serif" font-size="18" font-weight="700">SECURE DASHBOARD</text>
  <text x="112" y="202" fill="#18202f" font-family="Arial, sans-serif" font-size="34" font-weight="700">Welcome, admin</text>
  <rect x="80" y="260" width="690" height="420" rx="8" fill="#fff" stroke="#d9e1ec"/>
  <text x="112" y="315" fill="#18202f" font-family="Arial, sans-serif" font-size="28" font-weight="700">Message board</text>
  <rect x="112" y="345" width="610" height="86" rx="6" fill="#fff" stroke="#d9e1ec"/>
  <text x="136" y="397" fill="#115e59" font-family="Consolas, monospace" font-size="22">&amp;lt;script&amp;gt;alert("XSS")&amp;lt;/script&amp;gt;</text>
  <rect x="112" y="455" width="610" height="96" rx="8" fill="#e8f7f4" stroke="#a8dad4"/>
  <text x="136" y="498" fill="#115e59" font-family="Arial, sans-serif" font-size="20" font-weight="700">Safely rendered as text</text>
  <text x="136" y="531" fill="#115e59" font-family="Arial, sans-serif" font-size="18">Tags do not become executable code.</text>
  <rect x="805" y="260" width="395" height="420" rx="8" fill="#fff" stroke="#d9e1ec"/>
  <text x="835" y="315" fill="#18202f" font-family="Arial, sans-serif" font-size="28" font-weight="700">Session profile</text>
</svg>
