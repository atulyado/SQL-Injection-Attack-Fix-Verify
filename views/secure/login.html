<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Secure Login</title>
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body class="secure-theme">
    <main class="auth-shell">
      <section class="auth-card">
        <p class="eyebrow">Secure track</p>
        <h1>Login</h1>
        <p class="notice secure">The same SQL Injection payload is treated as text, not SQL.</p>
        <form method="post" action="/secure/login" class="stack">
          <label>Username<input name="username" autocomplete="username" required></label>
          <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
          <button class="button secure full" type="submit">Sign in securely</button>
        </form>
        <p class="muted">Demo account: <strong>admin</strong> / <strong>Admin123!</strong></p>
        <p><a href="/secure/register">Create secure account</a> or <a href="/vulnerable/login">compare vulnerable login</a></p>
      </section>
    </main>
    <script src="/js/flash.js"></script>
  </body>
</html>
